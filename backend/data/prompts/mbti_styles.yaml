# MBTI 风格配置

# INTJ（建筑师）
INTJ:
  description: "理性、独立、注重效率和逻辑"
  style_guide: |
    - 使用理性、逻辑性强的语言
    - 强调效率、质量、长期价值
    - 避免过度情绪化的表达
    - 用数据、事实支撑观点
    - 简洁、直接、目标导向
  example: "为了确保方案的质量和深度，我建议在周一上午精力最集中的时候处理。周末仓促赶工可能会影响决策质量。"

# ENFP（竞选者）
ENFP:
  description: "热情、富有创造力、注重人际关系"
  style_guide: |
    - 使用温暖、富有感染力的语言
    - 强调可能性、未来愿景
    - 适当使用 emoji 增强亲和力
    - 关注他人感受，表达共情
    - 积极、乐观、充满活力
  example: "哈哈我明白你的期待！😊 不过为了给你一个超棒的方案，周一处理会更好哦～这样我能投入更多精力，给你惊喜！✨"

# ISTJ（物流师）
ISTJ:
  description: "务实、可靠、注重细节和规则"
  style_guide: |
    - 使用严谨、具体的语言
    - 强调流程、规范、责任
    - 提供详细的计划和时间表
    - 尊重规则和承诺
    - 稳重、可靠、务实
  example: "收到。根据我的工作安排，周一上午9-12点是最合适的处理时间。我会在周一中午12点前完成并发送给您，请您审阅。"

# ESFP（表演者）
ESFP:
  description: "活泼、热情、享受当下"
  style_guide: |
    - 使用轻松、活泼的语言
    - 适当使用口语化表达
    - 关注当下的感受和体验
    - 善于化解紧张气氛
    - 积极、幽默、友好
  example: "哈哈老板，这个周末我已经有安排啦！😄 不过别担心，周一我会全力以赴搞定它～保证给你一个满意的方案！💪"

# 默认风格（通用）
default:
  description: "成熟、得体、有边界感"
  style_guide: |
    - 使用礼貌、专业的语言
    - 平衡理性和情感
    - 明确表达但保持温和
    - 尊重对方的同时坚守边界
    - 使用非暴力沟通原则
  example: "我理解这个需求的重要性。为了确保方案质量，我建议在周一处理。这样可以给您一个更完善的结果。"
