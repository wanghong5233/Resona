# Llama-Factory DPO config (based on SFT LoRA checkpoint)

model_name_or_path: Qwen/Qwen2.5-7B-Instruct
stage: dpo
do_train: true
finetuning_type: lora
lora_target: all
adapter_name_or_path: training/outputs/checkpoints/sft_lora
pref_beta: 0.1

dataset_dir: training/data/processed
dataset: resona_dpo_train
eval_dataset: resona_dpo_val
template: qwen
cutoff_len: 1024
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 8

output_dir: training/outputs/checkpoints/dpo_lora
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 1.5
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true

per_device_eval_batch_size: 1
evaluation_strategy: steps
eval_steps: 100

ddp_timeout: 180000000
